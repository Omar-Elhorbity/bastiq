# Render Blueprint — FREE TIER ONLY (one web service + Postgres).
#
# Render's free plan covers Web Services and PostgreSQL, but NOT background
# workers (those are paid-only). Bastiq's only async work is sending
# verification/reset/invite emails, so this Blueprint runs Celery tasks EAGERLY
# (inline in the web process) via CELERY_TASK_ALWAYS_EAGER=true — no separate
# worker and no Redis broker are needed, and nothing here costs money.
#
# Free instances also don't support preDeployCommand or a Shell, so migrations
# and seeding run at container start (all idempotent). The app comes up
# demo-ready (Acme Inc + owner/admin/member + plans) with zero manual steps.
#
# Stripe is OPTIONAL. Leave the STRIPE_* vars blank for a no-payment showcase:
# billing checkout/portal return a clean 503, but everything else — auth, orgs,
# RBAC, projects, and the Free-plan project/member limits — works fully. To demo
# the "upgrade raises the limits" story without a payment provider, change an
# org's plan in the Django admin (Billing > Subscriptions: Free -> Pro).
#
# RENDER_EXTERNAL_HOSTNAME is auto-injected and trusted for ALLOWED_HOSTS and
# CSRF (admin login), so no host/origin config is needed.

databases:
  - name: bastiq-db
    plan: free
    databaseName: bastiq
    postgresMajorVersion: "16"

services:
  - type: web
    name: bastiq-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Free tier has no preDeployCommand / Shell, so migrate + seed at start.
    # All steps are idempotent; createsuperuser is best-effort — it only creates
    # an admin when DJANGO_SUPERUSER_* are set, and is a no-op on later boots.
    dockerCommand: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             (python manage.py createsuperuser --noinput || true) &&
             exec gunicorn bastiq.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile - --error-logfile -"
    envVars:
      - fromGroup: bastiq-env
      - key: DATABASE_URL
        fromDatabase:
          name: bastiq-db
          property: connectionString

envVarGroups:
  - name: bastiq-env
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""                 # RENDER_EXTERNAL_HOSTNAME is appended automatically
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"             # run async email inline — no worker/Redis on free tier
      - key: EMAIL_BACKEND
        value: console            # verification/reset tokens print to the web service log
      - key: DEFAULT_FROM_EMAIL
        value: no-reply@bastiq.example
      - key: DOCS_REQUIRE_AUTH
        value: "false"            # public Swagger for the demo

      # --- Optional admin: set BOTH to enable /admin/ login; leave blank to skip ---
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # --- Optional Stripe (leave blank for a no-payment-provider showcase) ---
      # If you later get Stripe access: set these, set FRONTEND_URL to your
      # https host, and add a webhook at https://<host>/api/billing/webhook.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
