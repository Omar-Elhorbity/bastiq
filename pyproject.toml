[project]
name = "bastiq"
version = "0.1.0"
description = "Multi-tenant SaaS backend: auth, organizations & RBAC, Stripe billing."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-comprehensions,
# flake8-django, security (bandit subset).
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "S"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # function calls in argument defaults (common, intentional in DRF)
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and hard-coded secrets/passwords.
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["bastiq", "core", "accounts", "organizations", "billing", "projects"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bastiq.test_settings"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers --reuse-db -p no:cacheprovider"
testpaths = ["accounts", "organizations", "billing", "projects", "core", "tests"]

[tool.coverage.run]
source = ["accounts", "organizations", "billing", "projects", "core", "bastiq"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "bastiq/test_settings.py",
    "bastiq/wsgi.py",
    "bastiq/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
