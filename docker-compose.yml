# Local development stack: web + db + redis + worker.
# `docker compose up` boots everything; values below are dev-safe defaults and
# are overridden by a local `.env` if present (copy from .env.example).
name: bastiq

x-app-env: &app-env
  DJANGO_SECRET_KEY: dev-insecure-secret-key-override-in-prod
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
  DATABASE_URL: postgres://postgres:postgres@db:5432/bastiq
  REDIS_URL: redis://redis:6379/0
  EMAIL_BACKEND: console
  FRONTEND_URL: http://localhost:8000

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bastiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bastiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    command: celery -A bastiq worker -l info --concurrency 2
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
